name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # test_data_integrity.py checks the assembled 24k corpus, which is not stored in the
      # repository (see data/README.md); every other test runs without data.
      - name: Tests
        run: pytest tests -q -p no:cacheprovider --ignore=tests/test_data_integrity.py

      - name: Methodological audit gate on run v3
        run: |
          xz -dk outputs/reports/v3/comparison_benchmark_results.json.xz
          python scripts/audit_checks.py --in-dir outputs/reports/v3
